plugins { id 'com.android.application' }

def releaseSigningEnvironment = [
    keystore: System.getenv('HOYOUNG_SIGNING_KEYSTORE'),
    alias: System.getenv('HOYOUNG_SIGNING_ALIAS'),
    storePassword: System.getenv('HOYOUNG_SIGNING_STORE_PASSWORD'),
    keyPassword: System.getenv('HOYOUNG_SIGNING_KEY_PASSWORD')
]
def releaseSigningReady = releaseSigningEnvironment.values().every { it != null && !it.isEmpty() }

android {
    namespace 'com.hoyoung.assistant'
    compileSdk 35
    ndkVersion '28.2.13676358'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    defaultConfig {
        applicationId 'com.hoyoung.assistant'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (releaseSigningReady) {
            hoyoungRelease {
                storeFile file(releaseSigningEnvironment.keystore)
                storeType 'PKCS12'
                keyAlias releaseSigningEnvironment.alias
                storePassword releaseSigningEnvironment.storePassword
                keyPassword releaseSigningEnvironment.keyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (releaseSigningReady) signingConfig signingConfigs.hoyoungRelease
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
}

// Keep debug builds available, but never accidentally publish an unsigned release.
gradle.taskGraph.whenReady { graph ->
    def buildsReleaseArtifact = graph.allTasks.any {
        it.project == project && it.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'signReleaseBundle']
    }
    if (buildsReleaseArtifact && !releaseSigningReady) {
        throw new GradleException('Release signing is missing. Build with mobile/tools/build-release.sh; private keys stay outside Git.')
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
